        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }

<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-sky-600 rounded-lg text-white shadow-lg shadow-sky-600/30">
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide text-white">STUDY</h1>
                <p class="text-xs text-slate-400">Học đi, web xịn đó -Phan create</p>

        </div>

        <!-- Navigation Tabs -->

            <button onclick="switchTab('notes')" id="nav-notes" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-2 transition-all text-slate-400 hover:text-slate-200">

            <button onclick="switchTab('apps')" id="nav-apps" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-2 transition-all text-slate-400 hover:text-slate-200">

    <!-- Main Workspace Container -->
    <main class="flex-1 relative overflow-hidden bg-slate-950">
        
        <!-- SECTION 1: CLOCK MODULE -->
        <section id="tab-clock" class="tab-content h-full p-4 sm:p-6 overflow-y-auto custom-scrollbar flex flex-col items-center justify-center">
            <div class="max-w-md w-full bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-xl">
                <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
                    <button onclick="setClockMode('down')" id="btn-mode-down" class="flex-1 py-1.5 rounded-lg text-xs font-medium transition bg-sky-600 text-white">Đếm Lùi (Pomodoro)</button>
                    <button onclick="setClockMode('up')" id="btn-mode-up" class="flex-1 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">Đếm Tiến (Bấm Giờ)</button>
                </div>

                <div class="relative w-64 h-64 mx-auto my-2 flex items-center justify-center">

                        <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-slate-800" fill="transparent" />
                        <circle id="timer-progress" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-sky-500 transition-all duration-300" fill="transparent" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" />
                    </svg>
                    <div class="absolute flex flex-col items-center">

                    <button onclick="setPreset(5, 'Nghỉ Ngắn')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition border border-slate-700/40">5m</button>
                    <button onclick="setPreset(15, 'Nghỉ Dài')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition border border-slate-700/40">15m</button>
                </div>

                <div class="flex items-center justify-center space-x-4 mt-4">
                    <button onclick="toggleTimer()" id="btn-timer-start" class="w-14 h-14 bg-sky-600 hover:bg-sky-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-sky-600/30 transition transform active:scale-95">

                    </button>
                    <button onclick="resetTimer()" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full flex items-center justify-center border border-slate-700/50 transition">

                    </button>

        </section>

        <!-- SECTION 2: TODO MATRIX -->

            <div class="max-w-5xl mx-auto space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                    <div class="flex-1 flex items-center space-x-2">
                        <input type="text" id="todo-input" placeholder="Nhập tên công việc mới..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">

                        </select>

                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex flex-col h-72">

                        </div>

                    </div>

                            <span>GẤP & ÍT QUAN TRỌNG</span>

                        </div>

                    </div>
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex flex-col h-72">
                        <div class="flex items-center justify-between mb-3 text-xs font-semibold text-slate-400">
                            <span>KHÔNG GẤP & ÍT QUAN TRỌNG</span>
                            <span class="bg-slate-800/60 border border-slate-700/40 px-2 py-0.5 rounded-md" id="count-p4">0</span>
                        </div>
                        <div id="list-p4" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 3: NOTES -->
        <section id="tab-notes" class="tab-content h-full flex flex-col md:flex-row overflow-hidden hidden">
            <div class="w-full md:w-72 bg-slate-900/80 border-r border-slate-800 flex flex-col shrink-0">
                <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Thư Mục & Ghi Chú</span>
                    <button onclick="promptCreateFolder()" class="p-1 hover:bg-slate-800 text-slate-400 hover:text-sky-400 rounded transition" title="Tạo Thư Mục Mới">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="folder-tree" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2"></div>
                <div class="p-3 border-t border-slate-800">
                    <button onclick="promptCreateNote()" class="w-full py-2 bg-sky-600/20 hover:bg-sky-600/30 border border-sky-700/50 text-sky-300 rounded-xl text-xs font-medium flex items-center justify-center space-x-1.5 transition">
                        <i data-lucide="file-plus" class="w-4 h-4"></i>
                        <span>Tạo Ghi Chú Mới</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
                <div class="p-3 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between">
                    <input type="text" id="note-title-input" placeholder="Tiêu đề ghi chú..." oninput="updateActiveNoteTitle(this.value)" class="bg-transparent text-sm font-semibold text-white focus:outline-none flex-1 mr-4">
                    <div class="flex items-center space-x-2">

                    </div>
                </div>
                <div class="flex-1 p-4 overflow-y-auto custom-scrollbar">
                    <div id="note-editor" contenteditable="true" oninput="updateActiveNoteContent(this.innerHTML)" class="live-markdown-editor min-h-full text-slate-300 text-sm leading-relaxed focus:outline-none" placeholder="Bắt đầu gõ ghi chú..."></div>

        <!-- SECTION 4: OPTION 1 - LAUNCHPAD DASHBOARD (OPEN IN NEW TAB) -->

                <!-- Quick Google Search Header Bar -->

                        </div>

                            <h2 class="text-sm font-bold text-white uppercase tracking-wider">Trạm Web Launchpad</h2>
                            <p class="text-xs text-slate-400">Truy cập tức thì các công cụ học tập & Google (Tab Mới)</p>
                        </div>
                    </div>

                    <!-- Search Box -->
                    <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 w-full sm:w-80 space-x-2 focus-within:border-sky-500 transition">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>

                        </button>
                    </div>

                    <button onclick="promptAddLaunchpadCard()" class="w-full sm:w-auto px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-medium flex items-center justify-center space-x-1.5 transition shrink-0">

                        <span>Thêm Web Mới</span>

    <!-- AUDIO FOCUS DRAWER -->
    <div id="audio-drawer" class="fixed inset-y-0 right-0 w-80 bg-slate-900/95 border-l border-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 backdrop-blur-xl p-4 flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div class="flex items-center space-x-2 text-sky-400">
                <i data-lucide="headphones" class="w-4 h-4"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider text-white">Nhạc Nền Tập Trung</h3>
            </div>
            <button onclick="toggleAudioDrawer()" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar py-4 space-y-4">
            <div class="space-y-2">
                <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Phát Nhạc YouTube</span>
                <div class="space-y-2">
                    <input type="text" id="yt-url-input" placeholder="Dán link YouTube..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                    <button onclick="loadCustomYT()" class="w-full py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-medium transition">Phát Nhạc Này</button>
                </div>
                <div class="aspect-video w-full rounded-xl overflow-hidden bg-black mt-2 border border-slate-800">
                    <iframe id="yt-iframe" class="w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- APP SCRIPT LOGIC -->
    <script>
        lucide.createIcons();

        const store = {
            activeTab: 'clock',
            clock: {
                mode: 'down',
                timeLeft: 25 * 60,
                totalTime: 25 * 60,
                countUpTime: 0,
                isRunning: false,
                timerId: null
            },
            todos: JSON.parse(localStorage.getItem('sh_todos')) || [],
            folders: JSON.parse(localStorage.getItem('sh_folders')) || [

            ],
            notes: JSON.parse(localStorage.getItem('sh_notes')) || [
                { id: 'n1', folderId: 'f1', title: 'Tế bào học', content: '# Tế bào học**Màng tế bào**: Bảo vệ- Nhân: Điều khiển' }
            ],
            activeNoteId: 'n1',
            launchpadCards: JSON.parse(localStorage.getItem('sh_launchpad')) || [
                { id: 'c1', name: 'Google Search', desc: 'Trình tìm kiếm Google', url: 'https://www.google.com', icon: 'search', color: 'from-blue-600 to-sky-500' },
                { id: 'c2', name: 'Google Drive', desc: 'Lưu trữ tài liệu học tập', url: 'https://drive.google.com', icon: 'hard-drive', color: 'from-emerald-600 to-teal-500' },
                { id: 'c3', name: 'Gmail', desc: 'Hộp thư điện tử', url: 'https://mail.google.com', icon: 'mail', color: 'from-rose-600 to-red-500' },
                { id: 'c4', name: 'Google Docs', desc: 'Soạn thảo tài liệu', url: 'https://docs.google.com', icon: 'file-text', color: 'from-sky-600 to-blue-500' },
                { id: 'c5', name: 'ChatGPT', desc: 'Trợ lý trí tuệ nhân tạo', url: 'https://chatgpt.com', icon: 'bot', color: 'from-emerald-700 to-green-600' },
                { id: 'c6', name: 'Wikipedia Tiếng Việt', desc: 'Bách khoa toàn thư mở', url: 'https://vi.wikipedia.org', icon: 'globe', color: 'from-slate-700 to-slate-600' },
                { id: 'c7', name: 'WolframAlpha', desc: 'Công cụ giải toán & khoa học', url: 'https://www.wolframalpha.com', icon: 'calculator', color: 'from-amber-600 to-orange-500' },
                { id: 'c8', name: 'Cambridge Dictionary', desc: 'Từ điển Anh - Anh / Anh - Việt', url: 'https://dictionary.cambridge.org', icon: 'book', color: 'from-purple-600 to-indigo-500' }
            ]
        };

        function saveData() {
            localStorage.setItem('sh_todos', JSON.stringify(store.todos));
            localStorage.setItem('sh_folders', JSON.stringify(store.folders));
            localStorage.setItem('sh_notes', JSON.stringify(store.notes));
            localStorage.setItem('sh_launchpad', JSON.stringify(store.launchpadCards));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('active', 'bg-sky-600', 'text-white');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const navBtn = document.getElementById(`nav-${tabId}`);
            navBtn.classList.add('active', 'bg-sky-600', 'text-white');
            navBtn.classList.remove('text-slate-400');

            store.activeTab = tabId;
            if (tabId === 'notes') renderNotesSidebar();
            if (tabId === 'apps') renderLaunchpadGrid();
            lucide.createIcons();
        }

        // CLOCK
        function setClockMode(mode) {
            store.clock.mode = mode;
            document.getElementById('btn-mode-down').className = mode === 'down' ? 'flex-1 py-1.5 rounded-lg text-xs font-medium transition bg-sky-600 text-white' : 'flex-1 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200';
            document.getElementById('btn-mode-up').className = mode === 'up' ? 'flex-1 py-1.5 rounded-lg text-xs font-medium transition bg-sky-600 text-white' : 'flex-1 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200';
            document.getElementById('pomodoro-presets').style.display = mode === 'down' ? 'flex' : 'none';
            resetTimer();
        }

        function setPreset(mins, label) {
            if (store.clock.mode !== 'down') return;
            store.clock.timeLeft = mins * 60;
            store.clock.totalTime = mins * 60;
            document.getElementById('timer-label').innerText = label;
            updateClockDisplay();
        }

        function updateClockDisplay() {
            let secs = store.clock.mode === 'down' ? store.clock.timeLeft : store.clock.countUpTime;
            let m = Math.floor(secs / 60).toString().padStart(2, '0');
            let s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;

            let progress = store.clock.mode === 'down' 
                ? (store.clock.timeLeft / store.clock.totalTime) * 276.46
                : ((store.clock.countUpTime % 3600) / 3600) * 276.46;
            document.getElementById('timer-progress').style.strokeDashoffset = 276.46 - progress;
        }

        function toggleTimer() {
            if (store.clock.isRunning) {
                clearInterval(store.clock.timerId);
                store.clock.isRunning = false;
                document.getElementById('btn-timer-start').innerHTML = '<i data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>';
            } else {
                store.clock.isRunning = true;
                document.getElementById('btn-timer-start').innerHTML = '<i data-lucide="pause" class="w-6 h-6 fill-current"></i>';
                store.clock.timerId = setInterval(() => {
                    if (store.clock.mode === 'down') {
                        if (store.clock.timeLeft > 0) {
                            store.clock.timeLeft--;
                        } else {
                            clearInterval(store.clock.timerId);
                            store.clock.isRunning = false;
                            alert('Đã hoàn thành phiên Pomodoro!');
                        }
                    } else {
                        store.clock.countUpTime++;
                    }
                    updateClockDisplay();
                }, 1000);
            }
            lucide.createIcons();
        }

        function resetTimer() {
            clearInterval(store.clock.timerId);
            store.clock.isRunning = false;
            store.clock.timeLeft = store.clock.totalTime;
            store.clock.countUpTime = 0;
            document.getElementById('btn-timer-start').innerHTML = '<i data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>';
            updateClockDisplay();
            lucide.createIcons();
        }

        // TODO
        function addTodo() {
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;
            const priority = document.getElementById('todo-priority').value;
            store.todos.push({ id: Date.now().toString(), text, priority, completed: false });
            input.value = '';
            saveData();
            renderTodos();
        }

        function toggleTodo(id) {
            const t = store.todos.find(x => x.id === id);
            if (t) t.completed = !t.completed;
            saveData();
            renderTodos();
        }

        function deleteTodo(id) {
            store.todos = store.todos.filter(x => x.id !== id);
            saveData();
            renderTodos();
        }

        function renderTodos() {
            ['p1', 'p2', 'p3', 'p4'].forEach(p => {
                document.getElementById(`list-${p}`).innerHTML = '';
            });
            let counts = { p1: 0, p2: 0, p3: 0, p4: 0 };

            store.todos.forEach(t => {
                counts[t.priority]++;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2.5 bg-slate-950/60 border border-slate-800/80 rounded-xl group";
                div.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo('${t.id}')" class="accent-sky-500 w-4 h-4 rounded">
                        <span class="text-xs text-slate-200 truncate ${t.completed ? 'line-through text-slate-500' : ''}">${t.text}</span>
                    </div>
                    <button onclick="deleteTodo('${t.id}')" class="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition p-1">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                document.getElementById(`list-${t.priority}`).appendChild(div);
            });

            ['p1', 'p2', 'p3', 'p4'].forEach(p => {
                document.getElementById(`count-${p}`).innerText = counts[p];
            });
            lucide.createIcons();
        }

        // NOTES
        function renderNotesSidebar() {
            const tree = document.getElementById('folder-tree');
            tree.innerHTML = '';

            store.folders.forEach(f => {
                const fDiv = document.createElement('div');
                fDiv.className = "space-y-1";
                
                const fHeader = document.createElement('div');
                fHeader.className = "flex items-center justify-between px-2 py-1.5 bg-slate-950/50 border border-slate-800/60 rounded-lg text-xs font-medium text-slate-300";
                fHeader.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <i data-lucide="folder" class="w-3.5 h-3.5 text-sky-400"></i>
                        <span class="truncate">${f.name}</span>
                    </div>
                    <button onclick="deleteFolder('${f.id}')" class="text-slate-500 hover:text-rose-400 p-0.5" title="Xóa thư mục">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                    </button>
                `;
                fDiv.appendChild(fHeader);

                const filesContainer = document.createElement('div');
                filesContainer.className = "pl-4 space-y-1 my-1";

                const folderNotes = store.notes.filter(n => n.folderId === f.id);
                folderNotes.forEach(n => {
                    const nBtn = document.createElement('button');
                    nBtn.onclick = () => selectNote(n.id);
                    nBtn.className = `w-full text-left px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between transition ${n.id === store.activeNoteId ? 'bg-sky-600 text-white font-medium' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
                    nBtn.innerHTML = `
                        <div class="flex items-center space-x-1.5 truncate">
                            <i data-lucide="file-text" class="w-3 h-3 shrink-0"></i>
                            <span class="truncate">${n.title || 'Không tiêu đề'}</span>
                        </div>
                    `;
                    filesContainer.appendChild(nBtn);
                });

                fDiv.appendChild(filesContainer);
                tree.appendChild(fDiv);
            });

            if (store.notes.length > 0 && !store.notes.some(n => n.id === store.activeNoteId)) {
                store.activeNoteId = store.notes[0].id;
            }
            loadActiveNoteToEditor();
            lucide.createIcons();
        }

        function promptCreateFolder() {
            const name = prompt('Nhập tên thư mục mới:');
            if (!name) return;
            store.folders.push({ id: 'f_' + Date.now(), name });
            saveData();
            renderNotesSidebar();
        }

        function deleteFolder(folderId) {
            if (!confirm('Bạn có chắc muốn xóa thư mục này và tất cả ghi chú bên trong?')) return;
            store.notes = store.notes.filter(n => n.folderId !== folderId);
            store.folders = store.folders.filter(f => f.id !== folderId);
            saveData();
            renderNotesSidebar();
        }

        function promptCreateNote() {
            if (store.folders.length === 0) {
                alert('Vui lòng tạo ít nhất một thư mục trước!');
                return;
            }
            let folderListStr = store.folders.map((f, idx) => `${idx + 1}. ${f.name} (ID: ${f.id})`).join('\n');
            let choice = prompt(`Chọn thư mục để đặt file ghi chú:\n${folderListStr}\nNhập số hoặc ID thư mục:`);
            if (!choice) return;

            let targetFolder = store.folders.find(f => f.id === choice);
            if (!targetFolder) {
                let idx = parseInt(choice) - 1;
                if (!isNaN(idx) && store.folders[idx]) {
                    targetFolder = store.folders[idx];
                }
            }
            if (!targetFolder) {
                alert('Thư mục không hợp lệ!');
                return;
            }

            const title = prompt('Nhập tiêu đề ghi chú mới:', 'Ghi chú mới');
            if (title === null) return;

            const newNote = {
                id: 'n_' + Date.now(),
                folderId: targetFolder.id,
                title: title || 'Ghi chú mới',
                content: '# ' + (title || 'Ghi chú mới') + '\n\nBắt đầu viết nội dung...'
            };

            store.notes.push(newNote);
            store.activeNoteId = newNote.id;
            saveData();
            renderNotesSidebar();
        }

        function selectNote(id) {
            store.activeNoteId = id;
            renderNotesSidebar();
        }

        function loadActiveNoteToEditor() {
            const note = store.notes.find(n => n.id === store.activeNoteId);
            const titleInput = document.getElementById('note-title-input');
            const editor = document.getElementById('note-editor');
            if (note) {
                titleInput.value = note.title;
                editor.innerHTML = note.content;
                titleInput.disabled = false;
                editor.contentEditable = true;
            } else {
                titleInput.value = '';
                editor.innerHTML = 'Chưa có ghi chú nào.';
                titleInput.disabled = true;
                editor.contentEditable = false;
            }
        }

        function updateActiveNoteTitle(val) {
            const note = store.notes.find(n => n.id === store.activeNoteId);
            if (note) {
                note.title = val;
                saveData();
            }
        }

        function updateActiveNoteContent(html) {
            const note = store.notes.find(n => n.id === store.activeNoteId);
            if (note) {
                note.content = html;
                saveData();
            }
        }

        function deleteActiveNote() {
            if (!store.activeNoteId) return;
            if (!confirm('Bạn có chắc muốn xóa ghi chú này?')) return;
            store.notes = store.notes.filter(n => n.id !== store.activeNoteId);
            if (store.notes.length > 0) {
                store.activeNoteId = store.notes[0].id;
            } else {
                store.activeNoteId = null;
            }
            saveData();
            renderNotesSidebar();
        }

        // OPTION 1: LAUNCHPAD GRID & BOOKMARKS
        function renderLaunchpadGrid() {
            const grid = document.getElementById('launchpad-grid');
            grid.innerHTML = '';

            const gradients = [
                'from-blue-600 to-sky-500',
                'from-emerald-600 to-teal-500',
                'from-rose-600 to-red-500',
                'from-purple-600 to-indigo-500',
                'from-amber-600 to-orange-500',
                'from-cyan-600 to-blue-500'
            ];

            store.launchpadCards.forEach((card, idx) => {
                const gradientClass = card.color || gradients[idx % gradients.length];
                const cardEl = document.createElement('div');
                cardEl.className = "bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition transform hover:-translate-y-1 shadow-lg group relative overflow-hidden";
                
                cardEl.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="p-3 bg-gradient-to-br ${gradientClass} rounded-xl text-white shadow-lg shrink-0">
                            <i data-lucide="${card.icon || 'globe'}" class="w-5 h-5"></i>
                        </div>
                        <button onclick="deleteLaunchpadCard(event, '${card.id}')" class="p-1.5 text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition rounded-lg hover:bg-slate-800" title="Xóa bookmark">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <div class="my-4">
                        <h3 class="text-sm font-bold text-white group-hover:text-sky-400 transition truncate">${card.name}</h3>
                        <p class="text-xs text-slate-400 line-clamp-2 mt-1">${card.desc || card.url}</p>
                    </div>

                    <a href="${card.url}" target="_blank" class="w-full py-2 bg-slate-800 hover:bg-sky-600 text-slate-200 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition border border-slate-700/50">
                        <span>Truy Cập (Tab Mới)</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                `;
                grid.appendChild(cardEl);
            });
            lucide.createIcons();
        }

        function promptAddLaunchpadCard() {
            const name = prompt('Nhập tên ứng dụng / web:');
            if (!name) return;
            let url = prompt('Nhập địa chỉ URL (VD: https://drive.google.com):', 'https://');
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            const desc = prompt('Nhập mô tả ngắn (không bắt buộc):', 'Ứng dụng học tập');

            store.launchpadCards.push({
                id: 'c_' + Date.now(),
                name,
                url,
                desc: desc || '',
                icon: 'globe',
                color: 'from-sky-600 to-blue-500'
            });
            saveData();
            renderLaunchpadGrid();
        }

        function deleteLaunchpadCard(event, id) {
            event.stopPropagation();
            if (!confirm('Bạn có chắc muốn xóa trang web này khỏi Launchpad không?')) return;
            store.launchpadCards = store.launchpadCards.filter(c => c.id !== id);
            saveData();
            renderLaunchpadGrid();
        }

        function searchGoogleLaunchpad() {
            const input = document.getElementById('launchpad-search').value.trim();
            if (!input) return;
            if (input.startsWith('http://') || input.startsWith('https://')) {
                window.open(input, '_blank');
            } else {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(input)}`, '_blank');
            }
        }

        // AUDIO DRAWER
        function toggleAudioDrawer() {
            const drawer = document.getElementById('audio-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        function loadCustomYT() {
            const input = document.getElementById('yt-url-input').value.trim();
            if (!input) return;
            let videoId = input;
            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = input.match(regExp);
                if (match && match[2].length === 11) {
                    videoId = match[2];
                }
            }
            const iframe = document.getElementById('yt-iframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            alert('Đã tải nhạc YouTube thành công!');
        }

        window.onload = function() {
            renderTodos();
            renderNotesSidebar();
            renderLaunchpadGrid();
        };
    </script>
</body>
</html>
